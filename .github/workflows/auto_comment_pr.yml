name: Auto Comment on PR

on:
  pull_request:
    types: [opened]

jobs:
  comment:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Add AI collaborative auto-fix comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '@claude + @codex + @gemini-code-assist + @google-labs-jules + @chatgpt-codex-connector = "auto-fix/merge any conflicts"\n\n🤖 AI A2A + AI ML + AI RAG + AI MCP + AI Super Agents Mode: Enabled'
            })
