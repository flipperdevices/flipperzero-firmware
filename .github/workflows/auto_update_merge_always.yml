name: Auto-Update Branch and Auto-Merge Always

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  check_suite:
    types: [completed]
  status: {}
  schedule:
    - cron: '*/5 * * * *'

jobs:
  auto-update-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get all open PRs
        id: get-prs
        uses: actions/github-script@v7
        with:
          script: |
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            return pulls.data.map(pr => ({
              number: pr.number,
              title: pr.title,
              user: pr.user.login,
              mergeable_state: pr.mergeable_state,
              draft: pr.draft
            }));

      - name: Update all PR branches
        uses: actions/github-script@v7
        with:
          script: |
            const prs = ${{ steps.get-prs.outputs.result }};
            
            for (const pr of prs) {
              if (pr.draft) {
                console.log(`Skipping draft PR #${pr.number}`);
                continue;
              }
              
              try {
                // Update branch to latest base
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number
                });
                
                console.log(`✅ Updated PR #${pr.number}: ${pr.title}`);
                
              } catch (error) {
                if (error.status === 422) {
                  console.log(`PR #${pr.number} already up to date or cannot be updated`);
                } else {
                  console.log(`Failed to update PR #${pr.number}: ${error.message}`);
                }
              }
            }

  enable-auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get all open PRs
        id: get-prs
        uses: actions/github-script@v7
        with:
          script: |
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            return pulls.data.map(pr => ({
              number: pr.number,
              title: pr.title,
              user: pr.user.login,
              node_id: pr.node_id,
              draft: pr.draft
            }));

      - name: Enable auto-merge for all PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prs = ${{ steps.get-prs.outputs.result }};
            
            for (const pr of prs) {
              if (pr.draft) {
                console.log(`Skipping draft PR #${pr.number}`);
                continue;
              }
              
              try {
                // Enable auto-merge using GraphQL
                const mutation = `
                  mutation($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: {
                      pullRequestId: $pullRequestId,
                      mergeMethod: MERGE
                    }) {
                      pullRequest {
                        autoMergeRequest {
                          enabledAt
                        }
                      }
                    }
                  }
                `;
                
                const result = await github.graphql(mutation, {
                  pullRequestId: pr.node_id
                });
                
                console.log(`✅ Enabled auto-merge for PR #${pr.number}: ${pr.title}`);
                
                // Add label to indicate auto-merge is enabled
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: ['auto-merge-enabled']
                });
                
              } catch (error) {
                if (error.message.includes('already enabled')) {
                  console.log(`Auto-merge already enabled for PR #${pr.number}`);
                } else if (error.message.includes('not satisfied')) {
                  console.log(`PR #${pr.number} requirements not met yet`);
                } else {
                  console.log(`Failed to enable auto-merge for PR #${pr.number}: ${error.message}`);
                }
              }
            }

  force-merge-ready-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get mergeable PRs
        id: get-mergeable
        uses: actions/github-script@v7
        with:
          script: |
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            const mergeable = [];
            
            for (const pr of pulls.data) {
              if (pr.draft) continue;
              
              // Get detailed PR info
              const details = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number
              });
              
              // Check if mergeable
              if (details.data.mergeable === true && 
                  (details.data.mergeable_state === 'clean' || 
                   details.data.mergeable_state === 'unstable' ||
                   details.data.mergeable_state === 'has_hooks')) {
                mergeable.push({
                  number: pr.number,
                  title: pr.title,
                  user: pr.user.login,
                  mergeable_state: details.data.mergeable_state
                });
              }
            }
            
            return mergeable;

      - name: Force merge all ready PRs
        uses: actions/github-script@v7
        with:
          script: |
            const prs = ${{ steps.get-mergeable.outputs.result }};
            
            if (!prs || prs.length === 0) {
              console.log('No PRs ready for merge');
              return;
            }
            
            console.log(`Found ${prs.length} PRs ready for merge`);
            
            for (const pr of prs) {
              try {
                // Attempt merge
                const merge = await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  commit_title: `${pr.title}`,
                  commit_message: `Auto-merged via always-on merge system

🤖 **Auto-Merge:** Always enabled
👤 **Author:** @${pr.user}
📋 **Status:** ${pr.mergeable_state}

Co-Authored-By: Auto-Merge System <auto-merge@flipperzero.local>
Co-Authored-By: Warp <agent@warp.dev>`,
                  merge_method: 'merge'
                });
                
                console.log(`✅ Merged PR #${pr.number}: ${merge.data.sha}`);
                
                // Post success comment
                await github.rest.issues.createComment({
                  issue_number: pr.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `🎉 **Auto-Merged**

✅ **Merge SHA:** \`${merge.data.sha}\`
👤 **Author:** @${pr.user}
🤖 **System:** Always-on auto-merge

_This PR was automatically merged by the always-on merge system._`
                });
                
              } catch (error) {
                console.log(`Could not merge PR #${pr.number}: ${error.message}`);
                
                // Post comment if it's a conflict
                if (error.message.includes('conflict')) {
                  await github.rest.issues.createComment({
                    issue_number: pr.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    body: `⚠️ **Auto-Merge Blocked by Conflicts**

@claude + @codex + @gemini-code-assist + @google-labs-jules + @chatgpt-codex-connector

Please resolve merge conflicts to enable auto-merge.`
                  });
                }
              }
            }
