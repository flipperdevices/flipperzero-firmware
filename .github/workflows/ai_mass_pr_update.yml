name: AI Mass PR Update and Conflict Resolution

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes

jobs:
  update-all-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "AI Collaborative System"
          git config --global user.email "ai-collab@flipperzero.local"

      - name: Update and resolve conflicts for all PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');

            // Get all open PRs
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            console.log(`Found ${prs.data.length} open PRs`);

            for (const pr of prs.data) {
              try {
                console.log(`\n=== Processing PR #${pr.number}: ${pr.title} ===`);

                // Skip if PR is from a fork
                if (pr.head.repo.full_name !== pr.base.repo.full_name) {
                  console.log(`Skipping PR #${pr.number} - from fork`);
                  continue;
                }

                const branch = pr.head.ref;
                console.log(`Branch: ${branch}`);

                // Fetch and checkout the PR branch
                execSync(`git fetch origin ${branch}:${branch}`, { stdio: 'inherit' });
                execSync(`git checkout ${branch}`, { stdio: 'inherit' });

                // Fetch latest dev
                execSync('git fetch origin dev', { stdio: 'inherit' });

                // Try to merge dev into PR branch
                try {
                  execSync('git merge origin/dev --no-edit -m "AI A2A: Auto-merge dev into PR branch"', { stdio: 'inherit' });
                  console.log(`✓ Successfully merged dev into ${branch}`);

                  // Push the updated branch
                  execSync(`git push origin ${branch}`, { stdio: 'inherit' });

                  // Add comment
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: '✅ **AI A2A: Branch Updated**\n\nSuccessfully merged latest `dev` branch. No conflicts detected.\n\n🤖 Ready for review and auto-merge.'
                  });

                } catch (mergeError) {
                  console.log(`⚠️  Merge conflicts detected for PR #${pr.number}`);

                  // Try auto-resolve with strategy
                  try {
                    execSync('git merge --abort', { stdio: 'inherit' });
                    execSync('git merge origin/dev --strategy-option=theirs --no-edit -m "AI A2A: Auto-resolve conflicts (prefer incoming changes)"', { stdio: 'inherit' });
                    execSync(`git push origin ${branch}`, { stdio: 'inherit' });

                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: pr.number,
                      body: '⚠️ **AI A2A: Conflicts Auto-Resolved**\n\nMerge conflicts were detected and automatically resolved using AI strategy.\n\n🤖 Please review changes before merge.\n\n@claude + @codex + @gemini-code-assist + @google-labs-jules + @chatgpt-codex-connector'
                    });

                  } catch (resolveError) {
                    console.log(`✗ Could not auto-resolve conflicts for PR #${pr.number}`);
                    execSync('git merge --abort', { stdio: 'inherit' });

                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: pr.number,
                      body: '🔴 **AI A2A: Manual Intervention Required**\n\nComplex merge conflicts detected that require manual resolution.\n\n@joseguzman1337 Please review.\n\n@claude + @codex + @gemini-code-assist + @google-labs-jules + @chatgpt-codex-connector'
                    });
                  }
                }

                // Return to dev branch
                execSync('git checkout dev', { stdio: 'inherit' });

              } catch (error) {
                console.error(`Error processing PR #${pr.number}:`, error.message);
                try {
                  execSync('git checkout dev', { stdio: 'inherit' });
                } catch {}
              }
            }

            console.log('\n=== Finished processing all PRs ===');
