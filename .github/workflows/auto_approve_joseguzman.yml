name: Auto-Approve PRs by @joseguzman1337 after AI Review

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]
  check_suite:
    types: [completed]

jobs:
  multi-agent-review-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check if PR author is @joseguzman1337
        id: check-author
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              console.log('Not a PR event');
              return { isJoseGuzman: false };
            }
            
            const isJoseGuzman = pr.user.login === 'joseguzman1337';
            console.log(`PR #${pr.number} author: ${pr.user.login}`);
            console.log(`Is @joseguzman1337: ${isJoseGuzman}`);
            
            return {
              isJoseGuzman,
              prNumber: pr.number,
              prTitle: pr.title,
              prAuthor: pr.user.login
            };

      - name: Check AI multi-agent review status
        if: steps.check-author.outputs.result != '{"isJoseGuzman":false}'
        id: check-ai-reviews
        uses: actions/github-script@v7
        with:
          script: |
            const result = ${{ steps.check-author.outputs.result }};
            if (!result || !result.isJoseGuzman) {
              return { allReviewed: false };
            }
            
            const prNumber = result.prNumber;
            const requiredAIAgents = ['claude', 'codex', 'gemini-code-assist', 'google-labs-jules', 'chatgpt-codex-connector'];
            
            // Get all comments and reviews
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            // Check for AI agent reviews/mentions
            const commentBodies = comments.data.map(c => c.body.toLowerCase()).join(' ');
            const reviewBodies = reviews.data.map(r => r.body?.toLowerCase() || '').join(' ');
            const allText = commentBodies + ' ' + reviewBodies;
            
            // Check if all required AI agents have reviewed
            const reviewedBy = requiredAIAgents.filter(agent => 
              allText.includes(`@${agent}`) || allText.includes(agent.replace(/-/g, ''))
            );
            
            const allReviewed = reviewedBy.length === requiredAIAgents.length;
            
            console.log(`AI Agents reviewed by: ${reviewedBy.join(', ')}`);
            console.log(`All required agents reviewed: ${allReviewed}`);
            
            // Check for explicit review completion signals
            const hasCompletionSignal = 
              allText.includes('ai a2a collaboration complete') ||
              allText.includes('auto-fix/merge any conflicts') ||
              allText.includes('all ai assistants have reviewed');
            
            return {
              allReviewed: allReviewed || hasCompletionSignal,
              reviewedBy: reviewedBy.join(', '),
              prNumber,
              prTitle: result.prTitle
            };

      - name: Auto-approve PR after AI review
        if: steps.check-ai-reviews.outputs.result != '{"allReviewed":false}'
        id: auto-approve
        uses: actions/github-script@v7
        with:
          script: |
            const result = ${{ steps.check-ai-reviews.outputs.result }};
            if (!result || !result.allReviewed) {
              console.log('Not all AI agents have reviewed yet');
              return;
            }
            
            try {
              // Create approval review
              const approval = await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: result.prNumber,
                event: 'APPROVE',
                body: `✅ **Auto-Approved via AI Multi-Agent Review System**

🤖 **Reviewed by:** ${result.reviewedBy}

All required AI agents have completed their review:
- @claude
- @codex
- @gemini-code-assist
- @google-labs-jules
- @chatgpt-codex-connector

🎯 **Author:** @joseguzman1337
📋 **Status:** Ready for auto-merge

_This approval was automatically granted per project rules._`
              });
              
              console.log(`✅ PR #${result.prNumber} auto-approved`);
              
              // Add labels
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: result.prNumber,
                labels: ['ai-reviewed', 'auto-approved', 'joseguzman1337']
              });
              
              return {
                approved: true,
                reviewId: approval.data.id
              };
              
            } catch (error) {
              console.error('Approval failed:', error.message);
              
              // Post comment explaining the issue
              await github.rest.issues.createComment({
                issue_number: result.prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `⚠️ **Auto-Approval Attempted**

All AI agents have reviewed, but auto-approval encountered an issue:
\`\`\`
${error.message}
\`\`\`

Manual approval may be required.`
              });
              
              throw error;
            }

      - name: Auto-merge approved PR
        if: steps.auto-approve.outputs.result != 'null' && steps.auto-approve.outputs.result != ''
        uses: actions/github-script@v7
        with:
          script: |
            const approvalResult = ${{ steps.auto-approve.outputs.result }};
            const reviewResult = ${{ steps.check-ai-reviews.outputs.result }};
            
            if (!approvalResult || !approvalResult.approved) {
              console.log('PR not approved, skipping merge');
              return;
            }
            
            const prNumber = reviewResult.prNumber;
            
            // Check if PR is mergeable
            const prData = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            console.log(`PR mergeable state: ${prData.data.mergeable_state}`);
            console.log(`PR mergeable: ${prData.data.mergeable}`);
            
            // Wait for checks to complete if needed
            if (prData.data.mergeable_state === 'blocked' || prData.data.mergeable_state === 'behind') {
              console.log('PR not ready to merge yet, waiting for checks or needs update');
              return;
            }
            
            // Attempt merge
            try {
              const merge = await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                commit_title: `${reviewResult.prTitle}`,
                commit_message: `Auto-merged after AI multi-agent review

✅ **Reviewed and Approved by:**
@claude + @codex + @gemini-code-assist + @google-labs-jules + @chatgpt-codex-connector

🤖 **AI Systems Active:**
- AI ML (Machine Learning Analysis)
- AI RAG (Retrieval-Augmented Generation)
- AI MCP (Model Control Protocol)
- AI Super Agents (Autonomous Decision Making)

👤 **Author:** @joseguzman1337
📋 **Auto-approval:** Enabled per project rules

Co-Authored-By: AI Multi-Agent System <ai-agents@flipperzero.local>
Co-Authored-By: Warp <agent@warp.dev>`,
                merge_method: 'merge'
              });
              
              console.log(`✅ PR #${prNumber} merged successfully: ${merge.data.sha}`);
              
              // Post success comment
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🎉 **Auto-Merged Successfully**

✅ **Merge SHA:** \`${merge.data.sha}\`
🤖 **Reviewed by:** All AI agents
👤 **Author:** @joseguzman1337

_This PR was automatically approved and merged after successful AI multi-agent review._`
              });
              
            } catch (error) {
              console.error('Merge failed:', error.message);
              
              // Post comment about merge failure
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `⚠️ **Auto-Merge Failed**

The PR was approved but could not be automatically merged:
\`\`\`
${error.message}
\`\`\`

${error.message.includes('conflict') ? '@claude + @codex + @gemini-code-assist + @google-labs-jules + @chatgpt-codex-connector\n\nPlease collaborate to resolve merge conflicts.' : 'Manual merge may be required.'}`
              });
            }
